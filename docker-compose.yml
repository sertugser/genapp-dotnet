# docker compose up: PostgreSQL, then the migrations (once), then the API with the web interface on
# http://localhost:8080. For the database only (dotnet run, tests): docker compose up -d postgres

x-connection-string: &connection-string
  Host=postgres;Port=5432;Database=genapp;Username=${POSTGRES_USER:-genapp};Password=${POSTGRES_PASSWORD:-genapp_dev}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: genapp
      POSTGRES_USER: ${POSTGRES_USER:-genapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genapp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the EF Core migrations and exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      ConnectionStrings__GenApp: *connection-string
    depends_on:
      postgres:
        condition: service_healthy

  # REST API and web interface. Development shows the OpenAPI page at /swagger (docs/api-design.md section 1).
  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GenApp: *connection-string
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Load test of the SRS performance requirements (#84, tests/load/genapp-load.js). The load profile keeps it out of
  # docker compose up; run it with: docker compose --profile load run --rm k6
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    environment:
      BASE_URL: http://api:8080
      SUMMARY_FILE: /results/load-test-summary.json
    volumes:
      - ./tests/load:/scripts:ro
      - ./tests/results:/results
    command: run /scripts/genapp-load.js
    depends_on:
      - api

volumes:
  pgdata:
