# docker compose up: PostgreSQL, then the migrations (once), then the sample data, then the API with the web interface
# on http://localhost:8080. For the database only (dotnet run, tests): docker compose up -d postgres

x-connection-string: &connection-string
  Host=postgres;Port=5432;Database=genapp;Username=${POSTGRES_USER:-genapp};Password=${POSTGRES_PASSWORD:-genapp_dev}

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: genapp
      POSTGRES_USER: ${POSTGRES_USER:-genapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genapp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the EF Core migrations and exits.
  migrate:
    build:
      context: .
      target: migrate
    environment:
      ConnectionStrings__GenApp: *connection-string
    depends_on:
      postgres:
        condition: service_healthy

  # Loads the Db2 sample data (customers and policies 1-10 of base/cntl/db2cre.jcl) and exits. Rows already there are
  # skipped, so it runs on every "up" without duplicating them (tools/GenApp.SampleData, #51).
  seed:
    build:
      context: .
      target: seed
    environment:
      ConnectionStrings__GenApp: *connection-string
    depends_on:
      migrate:
        condition: service_completed_successfully

  # REST API and web interface. Development shows the OpenAPI page at /swagger (docs/api-design.md section 1).
  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GenApp: *connection-string
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  pgdata:
