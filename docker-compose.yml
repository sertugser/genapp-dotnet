services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: genapp
      POSTGRES_USER: ${POSTGRES_USER:-genapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genapp_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
